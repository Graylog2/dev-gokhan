[project]
name = "glc-ui-sketch-pico"
version = "0.1.0"
description = "GLC UI Sketch with Starlette, Jinja, htmx and Pico CSS"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "jinja2>=3.1.6",
    "starlette>=1.10.0",
    "uvicorn>=0.54.0",
]

[tool.ruff]
line-length = 120

[tool.basedpyright]
exclude = [".venv"]
venvPath = "."
venv = ".venv"
