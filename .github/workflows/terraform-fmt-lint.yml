name: Terraform check formatting / linting

on: [push, pull_request]

jobs:
  terraform-fmt-lint:

    runs-on: ubuntu-latest

    steps:
    # Important: This sets up your GITHUB_WORKSPACE environment variable
    - uses: actions/checkout@v2

    - name: Check formatting of terraform files
      uses: dflook/terraform-fmt-check@v1
      id: terraform-fmt-check
      with:
        path: ./terraform

    - name: Wrong formatting found
      if: ${{ failure() && steps.terraform-fmt-check.outputs.failure-reason == 'check-failed' }}
      run: echo "Terraform formatting check failed"

    - uses: actions/cache@v2
      name: Cache plugin dir
      with:
        path: ~/.tflint.d/plugins
        key: ${{ runner.os }}-tflint-${{ hashFiles('./terraform/.tflint.hcl') }}

    - uses: terraform-linters/setup-tflint@v1
      name: Setup TFLint
      with:
        tflint_version: latest

    - name: Init TFLint
      run: |
        cd ./terraform
        tflint --init

    - name: Run TFLint in each of the customers scripts
      run: |
        cd ./terraform/customers
        for f in *; do
          if [ -d "$f" ]; then
            if [[ $f = customer_* ]]; then
              cd $f; tflint -c ../../.tflint.hcl -f compact; cd ..;
            fi
          fi
        done
